<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1B2430; --surface:#232D3B; --surface-2:#2A3547; --surface-3:#324056;
    --text:#EDEEF0; --text-dim:#93A0B3; --accent:#E8A33D; --accent-2:#4FA9A2;
    --danger:#E2626B; --border:#34405480; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;display:flex;flex-direction:column;background:radial-gradient(circle at 78% 16%,rgba(79,169,162,.08),transparent 30%),var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk','Segoe UI',sans-serif;}
  .topbar{height:46px;flex-shrink:0;display:flex;align-items:center;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--border);}
  .top-nav{display:flex;flex-wrap:wrap;gap:5px;}
  .nav-btn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:auto;height:32px;padding:0 10px;color:var(--text-dim);border-bottom:2px solid transparent;transition:background .15s ease,color .15s ease;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--surface-2);color:var(--text);border-bottom-color:var(--accent);font-weight:500;box-shadow:0 0 12px rgba(232,163,61,.5);}
  main{width:min(100%,1080px);margin:0 auto;padding:34px 44px;min-height:0;flex:1;display:flex;flex-direction:column;}
  .page-heading{margin-bottom:20px;}
  h1{font-size:24px;margin:0 0 4px;}
  .subtext{color:var(--text-dim);font-size:13px;margin:0;}
  .chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;min-height:0;flex:1;}
  .chat-panel,.members-panel{border:1px solid var(--border);border-radius:var(--radius);background:rgba(35,45,59,.7);}
  .chat-panel{min-height:520px;display:flex;flex-direction:column;overflow:hidden;}
  .chat-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);}
  .chat-header h2{font-size:14px;margin:0;}
  .chat-meta{display:flex;align-items:center;gap:9px;color:var(--text-dim);font-size:11px;}
  .connection{display:flex;align-items:center;gap:6px;}
  .connection::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-2);}
  .connection.offline::before{background:var(--danger);}
  .messages{flex:1;min-height:260px;padding:18px 14px;overflow:auto;}
  .message{display:flex;gap:9px;max-width:88%;margin-bottom:16px;}
  .message.mine{margin-left:auto;flex-direction:row-reverse;}
  .avatar{flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface-3);color:var(--accent);font:600 11px 'Space Grotesk',sans-serif;}
  .message.mine .avatar{background:rgba(232,163,61,.2);}
  .message-content{min-width:0;}
  .message-heading{display:flex;align-items:baseline;gap:7px;margin-bottom:4px;}
  .message.mine .message-heading{justify-content:flex-end;}
  .message-author{font-size:12px;font-weight:600;}
  .message-time{color:var(--text-dim);font-size:10px;}
  .message-bubble{padding:9px 11px;border-radius:9px;background:var(--surface-2);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
  .message.mine .message-bubble{background:rgba(232,163,61,.16);border:1px solid rgba(232,163,61,.28);}
  .message-actions{display:flex;gap:6px;margin-top:5px;}
  .message.mine .message-actions{justify-content:flex-end;}
  .message-action{border:0;padding:0;background:none;color:var(--text-dim);font:10px 'Inter',sans-serif;cursor:pointer;}
  .message-action:hover{color:var(--accent);}
  .message-edit{width:100%;min-height:58px;resize:vertical;background:var(--surface);border:1px solid var(--accent);border-radius:7px;color:var(--text);font:13px/1.5 'Inter',sans-serif;padding:8px;outline:none;}
  .message-edit-actions{display:flex;gap:6px;margin-top:6px;}
  .chat-status{min-height:17px;padding:0 12px 8px;color:var(--text-dim);font-size:11px;}
  .chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
  .chat-form textarea{flex:1;min-height:42px;max-height:130px;resize:vertical;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font:13px/1.4 'Inter',sans-serif;padding:9px;outline:none;}
  .chat-form textarea:focus{border-color:var(--accent);}
  .btn{border:1px solid var(--border);border-radius:7px;padding:8px 11px;background:var(--surface-2);color:var(--text);font:500 12px 'Inter',sans-serif;cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1B2430;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .members-panel{padding:14px;}
  .members-panel h2{font-size:14px;margin:0 0 5px;}
  .members-note{color:var(--text-dim);font-size:11.5px;line-height:1.45;margin:0 0 15px;}
  .member-list{display:flex;flex-direction:column;gap:6px;}
  .conversation-item{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;border-radius:7px;padding:7px;background:transparent;color:var(--text);text-align:left;font:12px 'Inter',sans-serif;cursor:pointer;}
  .conversation-item:hover,.conversation-item.active{border-color:var(--accent);background:var(--surface-2);}
  .conversation-item .member-avatar{flex:0 0 28px;}
  .conversation-divider{height:1px;margin:6px 0 2px;background:var(--border);}
  .member{display:flex;align-items:center;gap:8px;font-size:12px;}
  .member-avatar{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-3);color:var(--text);font:600 10px 'Space Grotesk',sans-serif;}
  .member-avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border:2px solid var(--surface);border-radius:50%;background:var(--accent-2);}
  .member-info{min-width:0;}
  .member-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .member-role{margin-top:2px;color:var(--text-dim);font-size:10px;}
  .unread-dot{width:7px;height:7px;flex:0 0 7px;margin-left:auto;border-radius:50%;background:var(--danger);box-shadow:0 0 7px rgba(226,98,107,.75);}
  @media(max-width:900px){
    .topbar{min-height:40px;height:auto;padding:4px 6px;}
    .top-nav{gap:2px;}
    .nav-btn{height:28px;padding:0 8px;font-size:12px;}
    main{padding:18px 8px;}
    .page-heading{margin-bottom:14px;}
    h1{font-size:20px;}
    .chat-layout{grid-template-columns:1fr;gap:10px;}
    .chat-panel{min-height:430px;}
    .members-panel{order:2;}
    .chat-form{padding:8px;}
  }
</style>
</head>
<body>
<header class="topbar">
  <nav class="top-nav" aria-label="Main navigation">
    <a class="nav-btn" href="index.html">Call</a>
    <a class="nav-btn" href="index.html#notepad">Notepad</a>
    <a class="nav-btn" href="index.html#click">Click</a>
    <a class="nav-btn" href="index.html#clock">Clock</a>
    <a class="nav-btn" href="resources.html">Resources</a>
    <a class="nav-btn active" href="chat.html">Chat</a>
  </nav>
</header>
<main>
  <div class="chat-layout">
    <section class="chat-panel" aria-label="Team conference chat">
      <div class="chat-header">
        <div><h2 id="chat-title">General discussion</h2></div>
        <div class="chat-meta"><span>Shared room</span><span class="connection" id="connection-status">Connecting</span></div>
      </div>
      <div class="messages" id="messages" aria-live="polite"><p class="chat-status">Loading recent messages...</p></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" placeholder="Write a message to the group..." aria-label="Write a message" rows="1"></textarea>
        <button class="btn primary" id="send-button" type="submit">Send</button>
      </form>
    </section>
    <aside class="members-panel" aria-label="Conference members">
      <h2>Members</h2>
      <div class="member-list" id="member-list"><p class="members-note">Loading accounts...</p></div>
    </aside>
  </div>
</main>
<script>
const SUPABASE_URL = 'https://owbxunszjwsaozchjmei.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Ynh1bnN6andzYW96Y2hqbWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTI2MDYsImV4cCI6MjEwNDc4ODYwNn0.AOn_3Ifth5awi_nxTEqO2Ng3ODuq_rWFHCi0AO7e3Hg';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const form = document.getElementById('chat-form');
const input = document.getElementById('chat-input');
const messages = document.getElementById('messages');
const sendButton = document.getElementById('send-button');
const connectionStatus = document.getElementById('connection-status');
const chatTitle = document.getElementById('chat-title');
const memberList = document.getElementById('member-list');
const username = (localStorage.getItem('qd-username') || '').trim();
const ROOM_KEY = 'general';
const HISTORY_LIMIT = 100;
let account = null;
let accounts = [];
let chatMode = 'room';
let selectedRecipient = null;
let chatMessages = [];
let unreadByAccount = new Map();
let realtimeChannel = null;

function setConnectionStatus(text, offline = false){
  connectionStatus.textContent = text;
  connectionStatus.classList.toggle('offline', offline);
}
function initialsFor(name){ return name.slice(0, 2).toUpperCase(); }
function formatMessageTime(value){ return new Date(value).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }
function isCurrentConversation(message){
  if(message.room_key !== ROOM_KEY) return false;
  if(chatMode === 'room') return !message.recipient_account_id;
  return Boolean(selectedRecipient && message.recipient_account_id
    && ((message.account_id === account.id && message.recipient_account_id === selectedRecipient.id)
      || (message.account_id === selectedRecipient.id && message.recipient_account_id === account.id)));
}
function setStatus(text){
  messages.replaceChildren();
  const status = document.createElement('p');
  status.className = 'chat-status';
  status.textContent = text;
  messages.appendChild(status);
}
function renderMessage(message){
  const mine = account && message.account_id === account.id;
  const item = document.createElement('article');
  item.className = `message${mine ? ' mine' : ''}`;
  item.dataset.messageId = message.id;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = initialsFor(message.author_username);
  const content = document.createElement('div');
  content.className = 'message-content';
  const heading = document.createElement('div');
  heading.className = 'message-heading';
  const author = document.createElement('span');
  author.className = 'message-author';
  author.textContent = message.author_username;
  const time = document.createElement('time');
  time.className = 'message-time';
  time.textContent = formatMessageTime(message.created_at);
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = message.body;
  heading.append(author, time);
  content.append(heading, bubble);
  if(mine){
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    const actionsForMessage = chatMode === 'private'
      ? [['Edit', () => beginEdit(message, item)]]
      : [['Edit', () => beginEdit(message, item)], ['Delete', () => deleteMessage(message)]];
    actionsForMessage.forEach(([label, handler]) => {
      const button = document.createElement('button');
      button.className = 'message-action';
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', handler);
      actions.appendChild(button);
    });
    content.appendChild(actions);
  }
  item.append(avatar, content);
  messages.appendChild(item);
}
function renderMessages(scrollToBottom = false){
  messages.replaceChildren();
  chatMessages.forEach(renderMessage);
  if(scrollToBottom) messages.scrollTop = messages.scrollHeight;
}
function upsertMessage(message){
  const index = chatMessages.findIndex(item => item.id === message.id);
  if(index === -1) chatMessages.push(message);
  else chatMessages[index] = message;
  chatMessages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  renderMessages(index === -1);
}
function removeMessage(id){
  chatMessages = chatMessages.filter(message => message.id !== id);
  renderMessages();
}
function renderUnreadDot(button, unread){
  const existing = button.querySelector('.unread-dot');
  if(existing) existing.remove();
  if(unread){
    const dot = document.createElement('span');
    dot.className = 'unread-dot';
    dot.title = 'Unread message';
    button.appendChild(dot);
  }
}
function refreshUnreadDots(){
  memberList.querySelectorAll('.conversation-item[data-account-id]').forEach(button => {
    renderUnreadDot(button, unreadByAccount.has(button.dataset.accountId));
  });
}
function beginEdit(message, item){
  const content = item.querySelector('.message-content');
  content.replaceChildren();
  const editor = document.createElement('textarea');
  editor.className = 'message-edit';
  editor.value = message.body;
  const actions = document.createElement('div');
  actions.className = 'message-edit-actions';
  const save = document.createElement('button');
  save.className = 'btn primary';
  save.type = 'button';
  save.textContent = 'Save';
  const cancel = document.createElement('button');
  cancel.className = 'btn';
  cancel.type = 'button';
  cancel.textContent = 'Cancel';
  save.addEventListener('click', async () => {
    const body = editor.value.trim();
    if(!body){ editor.focus(); return; }
    save.disabled = true;
    const result = await sb.from('chat_messages').update({ body, updated_at:new Date().toISOString() }).eq('id', message.id).eq('account_id', account.id).select('*').single();
    if(result.error){ console.error('Could not edit chat message:', result.error); save.disabled = false; return; }
    upsertMessage(result.data);
  });
  cancel.addEventListener('click', () => renderMessages());
  actions.append(save, cancel);
  content.append(editor, actions);
  editor.focus();
}
async function deleteMessage(message){
  if(!confirm('Delete this message?')) return;
  const result = await sb.from('chat_messages').delete().eq('id', message.id).eq('account_id', account.id);
  if(result.error) console.error('Could not delete chat message:', result.error);
}
async function loadAccount(){
  if(!username){ throw new Error('Log in on the Call page before opening chat.'); }
  if(!sb) throw new Error('Chat service is unavailable.');
  const result = await sb.from('accounts').select('id, username').ilike('username', username).maybeSingle();
  if(result.error) throw result.error;
  if(!result.data) throw new Error('Your account could not be found. Log in again on the Call page.');
  account = result.data;
}
async function loadAccounts(){
  const result = await sb.from('accounts').select('id, username').order('username', { ascending:true });
  if(result.error) throw result.error;
  accounts = (result.data || []).filter(item => item.id !== account.id);
  memberList.replaceChildren();
  if(!accounts.length){
    const empty = document.createElement('p');
    empty.className = 'members-note';
    empty.textContent = 'No other accounts are available yet.';
    memberList.appendChild(empty);
  }
  accounts.forEach(item => {
    const member = document.createElement('button');
    member.className = 'conversation-item';
    member.type = 'button';
    member.dataset.accountId = item.id;
    const avatar = document.createElement('span');
    avatar.className = 'member-avatar';
    avatar.textContent = initialsFor(item.username);
    const info = document.createElement('span');
    info.className = 'member-info';
    const name = document.createElement('span');
    name.className = 'member-name';
    name.textContent = item.username;
    info.append(name);
    member.append(avatar, info);
    memberList.appendChild(member);
    member.addEventListener('click', () => selectRecipient(item));
  });
  const divider = document.createElement('div');
  divider.className = 'conversation-divider';
  memberList.appendChild(divider);
  const roomButton = document.createElement('button');
  roomButton.className = 'conversation-item';
  roomButton.type = 'button';
  roomButton.dataset.conversation = 'room';
  const roomAvatar = document.createElement('span');
  roomAvatar.className = 'member-avatar';
  roomAvatar.textContent = 'CR';
  const roomInfo = document.createElement('span');
  roomInfo.className = 'member-info';
  const roomName = document.createElement('span');
  roomName.className = 'member-name';
  roomName.textContent = 'Conference room';
  const roomRole = document.createElement('span');
  roomRole.className = 'member-role';
  roomRole.textContent = 'Everyone';
  roomInfo.append(roomName, roomRole);
  roomButton.append(roomAvatar, roomInfo);
  roomButton.addEventListener('click', selectRoom);
  memberList.appendChild(roomButton);
  roomButton.classList.add('active');
  refreshUnreadDots();
}
function updateModeUi(){
  const privateMode = chatMode === 'private';
  chatTitle.textContent = privateMode && selectedRecipient ? `Private chat with ${selectedRecipient.username}` : 'General discussion';
}
async function loadUnreadMessages(){
  const [messagesResult, readsResult] = await Promise.all([
    sb.from('chat_messages').select('account_id, created_at').eq('recipient_account_id', account.id).order('created_at', { ascending:true }),
    sb.from('chat_reads').select('peer_account_id, last_read_at').eq('account_id', account.id)
  ]);
  if(messagesResult.error) throw messagesResult.error;
  if(readsResult.error) throw readsResult.error;
  const lastRead = new Map((readsResult.data || []).map(item => [item.peer_account_id, new Date(item.last_read_at).getTime()]));
  unreadByAccount = new Map();
  (messagesResult.data || []).forEach(message => {
    const readAt = lastRead.get(message.account_id) || 0;
    if(new Date(message.created_at).getTime() > readAt) unreadByAccount.set(message.account_id, true);
  });
  refreshUnreadDots();
}
async function markConversationRead(recipient){
  const result = await sb.from('chat_reads').upsert({
    account_id:account.id,
    peer_account_id:recipient.id,
    last_read_at:new Date().toISOString()
  }, { onConflict:'account_id,peer_account_id' });
  if(result.error) throw result.error;
  unreadByAccount.delete(recipient.id);
  refreshUnreadDots();
}
async function loadConversation(){
  if(chatMode === 'private' && !selectedRecipient){
    chatMessages = [];
    renderMessages();
    setStatus('Choose a member to start a private conversation.');
    return;
  }
  let query = sb.from('chat_messages').select('*').eq('room_key', ROOM_KEY);
  if(chatMode === 'room'){
    query = query.is('recipient_account_id', null);
  }else{
    const pair = `and(account_id.eq.${account.id},recipient_account_id.eq.${selectedRecipient.id}),and(account_id.eq.${selectedRecipient.id},recipient_account_id.eq.${account.id})`;
    query = query.or(pair);
  }
  const result = await query.order('created_at', { ascending:false }).limit(HISTORY_LIMIT);
  if(result.error) throw result.error;
  chatMessages = (result.data || []).reverse();
  renderMessages(true);
}
async function selectRecipient(recipient){
  selectedRecipient = recipient;
  chatMode = 'private';
  memberList.querySelectorAll('.conversation-item').forEach(button => button.classList.toggle('active', button.dataset.accountId === recipient.id));
  updateModeUi();
  try{ await loadConversation(); await markConversationRead(recipient); }
  catch(error){ console.error('Could not load private conversation:', error); setStatus('Could not load this private conversation.'); }
}
async function selectRoom(){
  chatMode = 'room';
  selectedRecipient = null;
  memberList.querySelectorAll('.conversation-item').forEach(button => button.classList.toggle('active', button.dataset.conversation === 'room'));
  updateModeUi();
  try{ await loadConversation(); }
  catch(error){ console.error('Could not load shared room:', error); setStatus('Could not load the shared room.'); }
}
async function loadMessages(){
  return loadConversation();
}
function subscribeToMessages(){
  realtimeChannel = sb.channel('quiet-desk-general-chat')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages', filter:`room_key=eq.${ROOM_KEY}` }, payload => {
      if(isCurrentConversation(payload.new)) upsertMessage(payload.new);
      if(payload.new.recipient_account_id === account.id && !(chatMode === 'private' && selectedRecipient && selectedRecipient.id === payload.new.account_id)){
        unreadByAccount.set(payload.new.account_id, true);
        refreshUnreadDots();
      }
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'chat_messages', filter:`room_key=eq.${ROOM_KEY}` }, payload => { if(isCurrentConversation(payload.new)) upsertMessage(payload.new); })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'chat_messages', filter:`room_key=eq.${ROOM_KEY}` }, payload => removeMessage(payload.old.id))
    .subscribe(status => {
      if(status === 'SUBSCRIBED') setConnectionStatus('Live');
      if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setConnectionStatus('Offline', true);
    });
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  const body = input.value.trim();
  if(!body || !account || !sb) return;
  sendButton.disabled = true;
  const result = await sb.from('chat_messages').insert({
    room_key:ROOM_KEY,
    account_id:account.id,
    recipient_account_id:chatMode === 'private' && selectedRecipient ? selectedRecipient.id : null,
    author_username:account.username,
    body
  }).select('*').single();
  sendButton.disabled = false;
  if(result.error){ console.error('Could not send chat message:', result.error); return; }
  input.value = '';
  input.focus();
  upsertMessage(result.data);
});
input.addEventListener('keydown', event => {
  if(event.key === 'Enter' && !event.shiftKey){
    event.preventDefault();
    if(!sendButton.disabled) form.requestSubmit();
  }
});
(async function initializeChat(){
  try{
    await loadAccount();
    await loadAccounts();
    await loadMessages();
    await loadUnreadMessages();
    subscribeToMessages();
  }catch(error){
    console.error('Could not initialize shared chat:', error);
    setConnectionStatus('Unavailable', true);
    setStatus(error.message || 'Could not load shared chat.');
    sendButton.disabled = true;
  }
})();
</script>
</body>
</html>
