<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1B2430; --surface:#232D3B; --surface-2:#2A3547; --surface-3:#324056;
    --text:#EDEEF0; --text-dim:#93A0B3; --accent:#E8A33D; --accent-2:#4FA9A2;
    --danger:#E2626B; --border:#34405480; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{margin:0;background:radial-gradient(circle at 78% 16%,rgba(79,169,162,.08),transparent 30%),var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Space Grotesk','Segoe UI',sans-serif;}
  .topbar{height:46px;display:flex;align-items:center;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--border);}
  .top-nav{display:flex;flex-wrap:wrap;gap:5px;}
  .nav-btn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:auto;height:32px;padding:0 10px;color:var(--text-dim);border-bottom:2px solid transparent;transition:background .15s ease,color .15s ease;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--surface-2);color:var(--text);border-bottom-color:var(--accent);font-weight:500;box-shadow:0 0 12px rgba(232,163,61,.5);}
  main{max-width:980px;margin:0 auto;padding:44px;}
  h1{font-size:22px;margin:0 0 4px;}
  .subtext{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  .upload-panel{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(35,45,59,.7);}
  .drop-zone{display:flex;align-items:center;justify-content:center;min-height:120px;padding:18px;border:1px dashed var(--text-dim);border-radius:8px;background:rgba(42,53,71,.45);color:var(--text-dim);text-align:center;cursor:pointer;transition:border-color .15s ease,background .15s ease;}
  .drop-zone:hover,.drop-zone.dragging{border-color:var(--accent);background:rgba(232,163,61,.08);color:var(--text);}
  .drop-zone strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px;}
  .drop-zone input{display:none;}
  .upload-row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .btn{border:1px solid var(--border);border-radius:7px;padding:9px 13px;background:var(--surface-2);color:var(--text);font:500 13px 'Inter',sans-serif;cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1B2430;}
  .btn:disabled{opacity:.55;cursor:wait;}
  .status{min-height:20px;color:var(--text-dim);font-size:12.5px;}
  .resource-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 8px;}
  h2{font-size:19px;margin:0;}
  .resource-count{color:var(--text-dim);font-size:12px;}
  .resource-list{display:flex;flex-direction:column;gap:8px;}
  .resource-row{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--border);border-radius:8px;background:rgba(35,45,59,.55);}
  .resource-main{min-width:0;flex:1;}
  .resource-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:13.5px;}
  .resource-meta{margin-top:4px;color:var(--text-dim);font-size:11.5px;}
  .empty{padding:20px;border:1px dashed var(--border);border-radius:8px;color:var(--text-dim);font-size:13px;}
  .error{color:var(--danger);}
  @media(max-width:760px){
    .topbar{min-height:40px;height:auto;padding:4px 6px;}
    .top-nav{gap:2px;}
    .nav-btn{height:28px;padding:0 8px;font-size:12px;}
    main{padding:8px;}
    h1{font-size:20px;}
    .subtext{font-size:11.5px;margin-bottom:12px;}
    .upload-panel{padding:10px;}
    .drop-zone{min-height:92px;padding:12px;}
    .drop-zone strong{font-size:13px;margin-bottom:4px;}
    .upload-row{gap:8px;margin-top:8px;}
    .btn{padding:7px 10px;font-size:12px;}
    .status{font-size:11.5px;}
    .resource-head{margin:16px 0 6px;}
    h2{font-size:16px;}
    .resource-row{align-items:flex-start;flex-wrap:wrap;gap:8px;padding:9px 10px;}
    .resource-row .btn{margin-left:auto;}
    .resource-name{font-size:12.5px;}
    .resource-meta{font-size:10.5px;}
    .empty{padding:12px;font-size:12px;}
  }
</style>
</head>
<body>
<header class="topbar">
  <nav class="top-nav" aria-label="Main navigation">
    <a class="nav-btn" href="index.html">Call</a>
    <a class="nav-btn" href="index.html#notepad">Notepad</a>
    <a class="nav-btn" href="index.html#click">Click</a>
    <a class="nav-btn" href="index.html#clock">Clock</a>
    <a class="nav-btn active" href="resources.html">Resources</a>
    <a class="nav-btn" href="chat.html">Chat</a>
  </nav>
</header>
<main>
  <h1>Resources</h1>
  <p class="subtext">Keep your work files in one place and download anything with one click.</p>

  <section class="upload-panel" aria-labelledby="upload-heading">
    <div id="upload-heading" class="resource-name" style="font-size:15px;margin-bottom:12px;">Upload files</div>
    <label class="drop-zone" id="drop-zone" for="file-input">
      <span><strong>Choose files or drag them here</strong>Any file type is supported.</span>
      <input id="file-input" type="file" multiple>
    </label>
    <div class="upload-row">
      <button class="btn primary" id="upload-btn" type="button" disabled>Upload selected files</button>
      <span class="status" id="upload-status" role="status"></span>
    </div>
  </section>

  <div class="resource-head">
    <h2>All resources</h2>
    <span class="resource-count" id="resource-count"></span>
  </div>
  <div class="resource-list" id="resource-list"><div class="empty">Loading resources...</div></div>
</main>
<script>
const SUPABASE_URL = 'https://owbxunszjwsaozchjmei.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Ynh1bnN6andzYW96Y2hqbWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTI2MDYsImV4cCI6MjEwNDc4ODYwNn0.AOn_3Ifth5awi_nxTEqO2Ng3ODuq_rWFHCi0AO7e3Hg';
const BUCKET = 'resources';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const uploadBtn = document.getElementById('upload-btn');
const uploadStatus = document.getElementById('upload-status');
const resourceList = document.getElementById('resource-list');
const resourceCount = document.getElementById('resource-count');
let selectedFiles = [];

function setStatus(message, isError = false){
  uploadStatus.textContent = message;
  uploadStatus.classList.toggle('error', isError);
}
function formatBytes(bytes){
  if(!bytes) return 'Unknown size';
  const units = ['B','KB','MB','GB'];
  const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return `${(bytes / 1024 ** index).toFixed(index ? 1 : 0)} ${units[index]}`;
}
function formatDate(value){
  if(!value) return '';
  return new Date(value).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
}
function selectFiles(files){
  selectedFiles = [...files];
  uploadBtn.disabled = selectedFiles.length === 0;
  setStatus(selectedFiles.length ? `${selectedFiles.length} file${selectedFiles.length === 1 ? '' : 's'} selected.` : '');
}
fileInput.addEventListener('change', event => selectFiles(event.target.files));
['dragenter','dragover'].forEach(type => dropZone.addEventListener(type, event => { event.preventDefault(); dropZone.classList.add('dragging'); }));
['dragleave','drop'].forEach(type => dropZone.addEventListener(type, event => { event.preventDefault(); dropZone.classList.remove('dragging'); }));
dropZone.addEventListener('drop', event => selectFiles(event.dataTransfer.files));

async function loadResources(){
  const { data, error } = await sb.storage.from(BUCKET).list('', { limit:1000, sortBy:{ column:'name', order:'asc' } });
  if(error){ resourceList.innerHTML = `<div class="empty error">Could not load resources: ${error.message}</div>`; return; }
  const files = (data || []).filter(item => item.id);
  resourceCount.textContent = `${files.length} file${files.length === 1 ? '' : 's'}`;
  if(!files.length){ resourceList.innerHTML = '<div class="empty">No resources uploaded yet.</div>'; return; }
  resourceList.innerHTML = '';
  files.forEach(file => {
    const row = document.createElement('div');
    row.className = 'resource-row';
    const main = document.createElement('div');
    main.className = 'resource-main';
    const name = document.createElement('div');
    name.className = 'resource-name';
    name.textContent = file.name;
    name.title = file.name;
    const meta = document.createElement('div');
    meta.className = 'resource-meta';
    meta.textContent = [formatBytes(file.metadata?.size), formatDate(file.created_at)].filter(Boolean).join(' | ');
    const download = document.createElement('button');
    download.className = 'btn';
    download.type = 'button';
    download.textContent = 'Download';
    download.addEventListener('click', () => downloadResource(file.name, download));
    main.append(name, meta);
    row.append(main, download);
    resourceList.appendChild(row);
  });
}
async function downloadResource(path, button){
  button.disabled = true;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 60);
  button.disabled = false;
  if(error){ setStatus(`Could not create download link: ${error.message}`, true); return; }
  const link = document.createElement('a');
  link.href = data.signedUrl;
  link.download = path;
  link.target = '_blank';
  link.rel = 'noopener';
  document.body.appendChild(link);
  link.click();
  link.remove();
}
uploadBtn.addEventListener('click', async () => {
  if(!selectedFiles.length) return;
  uploadBtn.disabled = true;
  setStatus('Uploading...');
  for(const file of selectedFiles){
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeName}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType:file.type || 'application/octet-stream', upsert:false });
    if(error){ setStatus(`Upload failed for ${file.name}: ${error.message}`, true); uploadBtn.disabled = false; return; }
  }
  selectedFiles = [];
  fileInput.value = '';
  uploadBtn.disabled = true;
  setStatus('Upload complete.');
  loadResources();
});
loadResources();
</script>
</body>
</html>
