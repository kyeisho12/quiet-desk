function applyView(){world.style.transform=`translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.z})`;const grid=24*state.view.z;viewport.style.setProperty('--grid-x',`${state.view.x % grid}px`);viewport.style.setProperty('--grid-y',`${state.view.y % grid}px`);viewport.style.setProperty('--grid-size',`${Math.max(8,grid)}px`);zoomReadout.textContent=Math.round(state.view.z*100)+'%';world.classList.toggle('low-detail',state.view.z<.5);document.querySelectorAll('.card').forEach(card=>card.classList.toggle('lod',state.view.z<.5))}
function cardById(id){return state.cards.find(card=>card.id===id)}
function render(){cardLayer.innerHTML='';state.cards.forEach(card=>{const el=document.createElement('article');el.className=`card section-${card.section}${card.id===selectedId?' selected':''}${card.id===linkSource?' link-source':''}`;el.dataset.id=card.id;el.style.left=card.x+'px';el.style.top=card.y+'px';el.style.width=card.w+'px';const header=document.createElement('div');header.className='card-header';const title=document.createElement('div');title.className='card-title';title.textContent=card.title;const actions=document.createElement('div');actions.className='card-actions';const copy=document.createElement('button');copy.className='icon-btn';copy.type='button';copy.title='Copy script';copy.innerHTML='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="1"/><path d="M16 8V5H5v11h3"/></svg>';copy.addEventListener('pointerdown',event=>event.stopPropagation());copy.addEventListener('click',event=>{event.stopPropagation();copyText(card.text).then(()=>{copy.innerHTML='<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>';setTimeout(()=>{copy.innerHTML='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="1"/><path d="M16 8V5H5v11h3"/></svg>'},1200)}).catch(()=>setStatus('Could not copy script','error'))});const del=document.createElement('button');del.className='icon-btn';del.type='button';del.title='Delete card';del.textContent='×';del.addEventListener('pointerdown',event=>event.stopPropagation());del.addEventListener('click',event=>{event.stopPropagation();deleteCard(card.id)});actions.append(copy,del);header.append(title,actions);const body=document.createElement('div');body.className='card-body';body.textContent=card.text;const resize=document.createElement('div');resize.className='resize-handle';resize.title='Resize width';el.append(header,body,resize);cardLayer.appendChild(el);header.addEventListener('pointerdown',event=>startCardDrag(event,card.id));resize.addEventListener('pointerdown',event=>startResize(event,card.id)); function copyText(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();return ok?Promise.resolve():Promise.reject(new Error('copy unavailable'))}

function drawLink(link,rects){const from=cardById(link.from),to=cardById(link.to);if(!from||!to)return;const a=rects[from.id]||{x:from.x,y:from.y,w:from.w,h:150},b=rects[to.id]||{x:to.x,y:to.y,w:to.w,h:150};const points=[{x:a.x+a.w/2,y:a.y,side:'top'},{x:a.x+a.w,y:a.y+a.h/2,side:'right'},{x:a.x+a.w/2,y:a.y+a.h,side:'bottom'},{x:a.x,y:a.y+a.h/2,side:'left'}],targets=[{x:b.x+b.w/2,y:b.y},{x:b.x+b.w,y:b.y+b.h/2},{x:b.x+b.w/2,y:b.y+b.h},{x:b.x,y:b.y+b.h/2}];let start=points[0],end=targets[0],distance=Infinity;points.forEach(p=>targets.forEach(q=>{const d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<distance){distance=d;start=p;end=q}}));const dx=end.x-start.x,dy=end.y-start.y;let curve=Math.max(50,Math.min(180,Math.hypot(dx,dy)*.35));let c1={x:start.x,y:start.y},c2={x:end.x,y:end.y};if(start.side==='left')c1.x-=curve;if(start.side==='right')c1.x+=curve;if(start.side==='top')c1.y-=curve;if(start.side==='bottom')c1.y+=curve;if(end.side==='left')c2.x-=curve;if(end.side==='right')c2.x+=curve;if(end.side==='top')c2.y-=curve;if(end.side==='bottom')c2.y+=curve;let path=linkLayer.querySelector(`[data-link="${link.from}|${link.to}"]`);if(!path){path=document.createElementNS('http://www.w3.org/2000/svg','path');path.dataset.link=link.from+'|'+link.to;path.classList.add('link-hit');path.addEventListener('click',event=>{event.stopPropagation();selectedLink=path.dataset.link;selectedId=null;renderSelection()});path.addEventListener('pointerdown',event=>event.stopPropagation());linkLayer.appendChild(path)}path.setAttribute('d',`M ${start.x} ${start.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${end.x} ${end.y}`);path.setAttribute('marker-end',`url(#${selectedLink===path.dataset.link?'arrow-selected':'arrow'})`)}
function chooseLinkCard(id){if(!linkSource){linkSource=id;selectedId=id;renderSelection();return}if(linkSource!==id&&!state.links.some(link=>link.from===linkSource&&link.to===id)){state.links.push({from:linkSource,to:id});cacheAndQueue();renderLinks()}linkSource=null;renderSelection()}
function deleteCard(id){if(editing)return;state.cards=state.cards.filter(card=>card.id!==id);state.links=state.links.filter(link=>link.from!==id&&link.to!==id);if(selectedId===id)selectedId=null;cacheAndQueue();render()}
function fitAll(){const bounds=state.cards.reduce((box,card)=>{const element=document.querySelector(`[data-id="${CSS.escape(card.id)}"]`);const height=element?.offsetHeight||150;return {left:Math.min(box.left,card.x),top:Math.min(box.top,card.y),right:Math.max(box.right,card.x+card.w),bottom:Math.max(box.bottom,card.y+height)}},{left:Infinity,top:Infinity,right:-Infinity,bottom:-Infinity});const width=viewport.clientWidth,height=viewport.clientHeight,pad=70;state.view.z=Math.max(.1,Math.min(2.5,(width-pad*2)/(bounds.right-bounds.left),(height-pad*2)/(bounds.bottom-bounds.top)));state.view.x=(width-(bounds.right-bounds.left)*state.view.z)/2-bounds.left*state.view.z;state.view.y=(height-(bounds.bottom-bounds.top)*state.view.z)/2-bounds.top*state.view.z;applyView();cacheAndQueue()}
function addCard(clientX=viewport.clientWidth/2,clientY=viewport.clientHeight/2){const point=toWorld(clientX,clientY),id='card-'+Date.now();state.cards.push({id,section:'special',title:'New card',text:'',x:point.x-190,y:point.y-75,w:380});selectedId=id;cacheAndQueue();render();startEdit(id)}
function toWorld(clientX,clientY){const rect=viewport.getBoundingClientRect();return{x:(clientX-rect.left-state.view.x)/state.view.z,y:(clientY-rect.top-state.view.y)/state.view.z}}
function panStart(event){if(event.button!==0&&event.button!==1)return;if(event.target.closest('.card')&&(event.button===0||editing))return;if(event.button===0&&event.target.closest('path'))return;event.preventDefault();pointerAction={type:'pan',startX:event.clientX,startY:event.clientY,x:state.view.x,y:state.view.y};viewport.classList.add('panning');viewport.setPointerCapture(event.pointerId)}
viewport.addEventListener('pointerdown',panStart);viewport.addEventListener('pointermove',event=>{if(pointerAction?.type==='pan'){state.view.x=pointerAction.x+event.clientX-pointerAction.startX;state.view.y=pointerAction.y+event.clientY-pointerAction.startY;applyView();renderLinks();}else movePointer(event)});viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);viewport.addEventListener('dblclick',event=>{if(event.target===viewport)addCard(event.clientX,event.clientY)});viewport.addEventListener('wheel',event=>{event.preventDefault();const before=toWorld(event.clientX,event.clientY),factor=Math.exp(-event.deltaY*.0015),next=Math.max(.1,Math.min(2.5,state.view.z*factor));state.view.z=next;const rect=viewport.getBoundingClientRect();state.view.x=event.clientX-rect.left-before.x*next;state.view.y=event.clientY-rect.top-before.y*next;applyView();cacheAndQueue()},{passive:false});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&linkMode){linkMode=false;linkSource=null;linkToggle.classList.remove('active');renderSelection();return}if(editing)return;if((event.key==='Delete'||event.key==='Backspace')&&selectedLink){state.links=state.links.filter(link=>link.from+'|'+link.to!==selectedLink);selectedLink=null;cacheAndQueue();renderLinks();renderSelection()}else if((event.key==='Delete'||event.key==='Backspace')&&selectedId){deleteCard(selectedId)}});
linkToggle.addEventListener('click',()=>{linkMode=!linkMode;linkSource=null;linkToggle.classList.toggle('active',linkMode);renderSelection()});document.getElementById('add-card').addEventListener('click',()=>addCard());document.getElementById('fit-all').addEventListener('click',fitAll);document.getElementById('zoom-reset').addEventListener('click',()=>{state.view.z=1;applyView();cacheAndQueue()});document.getElementById('reset-layout').addEventListener('click',()=>{if(confirm('Reset the canvas layout and links?')){state=defaultState();fitAll();render()}});
async function init(){let cached=null;try{cached=normalizeState(JSON.parse(localStorage.getItem('qd-canvas')))}catch(error){}state=cached||defaultState();render();if(!cached)fitAll();if(!sb){setStatus('Offline - saved on this PC only','offline');return}try{const result=await sb.from('canvas_state').select('data').eq('id','main').maybeSingle();if(result.error)throw result.error;if(result.data?.data){state=normalizeState(result.data.data)||state;render()}setStatus('Synced')}catch(error){console.error(error);setStatus('Offline - saved on this PC only','offline')}}
init();
</script>
</body>
